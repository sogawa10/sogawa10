name: Update profile art

on:
  schedule:
    - cron: "30 18 * * *" # 毎日 3:30 JST に更新
  workflow_dispatch: # Actions タブから手動実行もできる

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      # ■ コントリビューションのグラフ → assets/contrib-day.svg / contrib-night.svg
      #   標準ライブラリだけで動くので pip install は不要
      - name: Generate contributions
        working-directory: tools
        run: python3 contrib.py "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ■ 成果物カード・GitHub Stats・言語比率・最近の活動 → assets/project-*.svg / stats-*.svg / langs-*.svg / activity-*.svg
      - name: Generate cards
        working-directory: tools
        run: python3 cards.py "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "Update profile art" || exit 0
          git pull --rebase
          git push
