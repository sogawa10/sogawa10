name: Update profile art

on:
  schedule:
    - cron: "30 18 * * *" # 毎日 3:30 JST に更新
  workflow_dispatch: # Actions タブから手動実行もできる

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      # ■ 草を食べるヘビ（ライト用・ダーク用の2枚）
      #   草の色は README のヘッダーに合わせて木の盤っぽい茶色系にしている
      #   color_dots は「草0 → 草が多い」の順に5色
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#2b1d0e&color_dots=#efe6d4,#e3c79a,#d9a066,#a8743f,#6b4423
            dist/snake-dark.svg?color_snake=#fff8e7&color_dots=#161b22,#4a3520,#8b5a2b,#c08446,#e8b673

      # ■ 3D の草（profile-3d-contrib/ に何種類か生成される）
      - name: Generate 3D contributions
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist profile-3d-contrib
          git commit -m "Update profile art" || exit 0
          git pull --rebase
          git push
