name: Update profile art

on:
  schedule:
    - cron: "30 18 * * *" # 毎日 3:30 JST に更新
  workflow_dispatch: # Actions タブから手動実行もできる

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      # ■ 3D の草（profile-3d-contrib/ に何種類か生成される）
      - name: Generate 3D contributions
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          git commit -m "Update profile art" || exit 0
          git pull --rebase
          git push
