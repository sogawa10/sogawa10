name: Update README cards

on:
  schedule:
    - cron: "0 18 * * *" # 毎日 3:00 JST に更新
  workflow_dispatch: # Actions タブから手動実行もできる

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # 色は README のヘッダー（木の盤っぽい茶色系）に合わせたカスタム配色
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&rank_icon=github&bg_color=fff8e7&title_color=8b5a2b&icon_color=d9a066&text_color=2b1d0e&ring_color=8b5a2b&border_color=d9a066&custom_title=sogawa10's 戦績
          path: profile/stats.svg
          # 非公開リポジトリも数えたいときは PAT を Secrets に登録して差し替える
          # token: ${{ secrets.STATS_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&bg_color=fff8e7&title_color=8b5a2b&text_color=2b1d0e&border_color=d9a066&custom_title=よく使う言語
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
