<svg xmlns="http://www.w3.org/2000/svg" width="268" height="82" viewBox="0 0 268 82">
<style>
.g{opacity:0.25;animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.25}50%{opacity:0.6}}
.r{opacity:0.00;animation:rim 3.2s ease-in-out infinite}
@keyframes rim{0%,100%{opacity:0.00}50%{opacity:0.0}}
.s{transform:translateX(-62.4px);animation:sweep 6.0s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-62.4px)}16%,100%{transform:translateX(62.4px)}}
@media (prefers-reduced-motion:reduce){.g,.r,.s{animation:none}}
</style>
<defs>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0.35" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/><stop offset="0.65" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect width="48" height="48" rx="11.25"/></clipPath>
</defs>
<g transform="translate(17,17)">
<rect class="g" style="animation-delay:-0.96s" x="-1" y="2" width="50" height="50" rx="12.25" fill="#23A8F2" filter="url(#blur)"/>
<image width="48" height="48" href="data:image/svg+xml;base64,"/>
<g clip-path="url(#clip)"><rect class="s" style="animation-delay:0.00s" width="48" height="48" fill="url(#shine)"/></g>
</g>
<g transform="translate(79,17)">
<rect class="g" style="animation-delay:-0.72s" x="-1" y="2" width="50" height="50" rx="12.25" fill="#000000" filter="url(#blur)"/>
<image width="48" height="48" href="data:image/svg+xml;base64,"/>
<g clip-path="url(#clip)"><rect class="s" style="animation-delay:0.12s" width="48" height="48" fill="url(#shine)"/></g>
</g>
<g transform="translate(141,17)">
<rect class="g" style="animation-delay:-0.48s" x="-1" y="2" width="50" height="50" rx="12.25" fill="#5865F2" filter="url(#blur)"/>
<image width="48" height="48" href="data:image/svg+xml;base64,"/>
<g clip-path="url(#clip)"><rect class="s" style="animation-delay:0.24s" width="48" height="48" fill="url(#shine)"/></g>
</g>
<g transform="translate(203,17)">
<rect class="g" style="animation-delay:-0.24s" x="-1" y="2" width="50" height="50" rx="12.25" fill="#E01E5A" filter="url(#blur)"/>
<image width="48" height="48" href="data:image/svg+xml;base64,"/>
<g clip-path="url(#clip)"><rect class="s" style="animation-delay:0.36s" width="48" height="48" fill="url(#shine)"/></g>
</g>
</svg>
