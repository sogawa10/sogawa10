<svg xmlns="http://www.w3.org/2000/svg" width="144" height="82" viewBox="0 0 144 82">
<style>
.g{opacity:0.45;animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.45}50%{opacity:1.0}}
.r{opacity:0.28;animation:rim 3.2s ease-in-out infinite}
@keyframes rim{0%,100%{opacity:0.28}50%{opacity:0.7}}
.s{transform:translateX(-62.4px);animation:sweep 6.0s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-62.4px)}16%,100%{transform:translateX(62.4px)}}
@media (prefers-reduced-motion:reduce){.g,.r,.s{animation:none}}
</style>
<defs>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0.35" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.38"/><stop offset="0.65" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect width="48" height="48" rx="11.25"/></clipPath>
</defs>
<g transform="translate(17,17)">
<rect class="g" style="animation-delay:-0.48s" x="-3" y="-3" width="54" height="54" rx="14.25" fill="#8CC84B" filter="url(#blur)"/>
<image width="48" height="48" href="data:image/svg+xml;base64,"/>
<g clip-path="url(#clip)"><rect class="s" style="animation-delay:0.00s" width="48" height="48" fill="url(#shine)"/></g>
<rect class="r" style="animation-delay:-0.48s" x="0.5" y="0.5" width="47" height="47" rx="11.25" fill="none" stroke="#8CC84B" stroke-width="1"/>
</g>
<g transform="translate(79,17)">
<rect class="g" style="animation-delay:-0.24s" x="-3" y="-3" width="54" height="54" rx="14.25" fill="#FFFFFF" filter="url(#blur)"/>
<image width="48" height="48" href="data:image/svg+xml;base64,"/>
<g clip-path="url(#clip)"><rect class="s" style="animation-delay:0.12s" width="48" height="48" fill="url(#shine)"/></g>
<rect class="r" style="animation-delay:-0.24s" x="0.5" y="0.5" width="47" height="47" rx="11.25" fill="none" stroke="#FFFFFF" stroke-width="1"/>
</g>
</svg>
